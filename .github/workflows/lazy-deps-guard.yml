name: Lazy-deps import guard

# Rejects any tracked production code that imports the tools/lazy_deps stub.
# pm.extras is the only lazy-install surface; a production import of the stub
# never gets its dependencies.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lazy-deps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lazy-deps-guard:
    name: No production imports of the tools.lazy_deps stub
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Check tools.lazy_deps imports in tracked production code
        run: python3 qubit_runtime/scripts/ci/check_lazy_deps_imports.py
