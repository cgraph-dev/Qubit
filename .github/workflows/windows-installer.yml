name: windows-installer

# Windows release validation for the root installer. This is the only workflow
# that asks a real Windows PowerShell parser/runner to load scripts/install.ps1;
# the Linux suite can only prove the static contract.
#
# A green run here is evidence toward Windows support, not a support claim.
# README.md and INSTALL.md keep the "validation pending" wording until the full
# install + update E2E passes on real Windows runners. The install step runs
# on pushes to main and on a workflow_dispatch with run_install enabled, always
# with -NoModels -NoDashboard (the pinned downloads and dashboard build are
# separate gaps).
on:
  pull_request:
    paths:
      - "scripts/install.ps1"
      - "scripts/install.cmd"
      - "qubit_runtime/scripts/install.ps1"
      - "qubit_runtime/scripts/install.cmd"
      - "tests/test_root_installer_windows.py"
      - ".github/workflows/windows-installer.yml"
  push:
    branches: [main, production]
    paths:
      - "scripts/install.ps1"
      - "scripts/install.cmd"
      - "qubit_runtime/scripts/install.ps1"
      - "qubit_runtime/scripts/install.cmd"
      - "tests/test_root_installer_windows.py"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:
    inputs:
      run_install:
        description: "Run the real install E2E (-NoModels -NoDashboard)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  installer-contract:
    name: Installer contract and Windows install E2E
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Static Windows installer contract
        run: python -m pytest -q tests/test_root_installer_windows.py
      - name: Parse the installer with the real PowerShell parser
        run: |
          $errors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path -LiteralPath scripts/install.ps1).Path,
            [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Select-Object -First 8 | ForEach-Object {
              Write-Output ("{0}: {1}" -f $_.Extent.StartLineNumber, $_.Message)
            }
            throw "scripts/install.ps1 does not parse"
          }
      - name: Help and dry-run make no changes
        run: |
          $home = Join-Path $env:RUNNER_TEMP "qubit-installer-dryrun"
          if (Test-Path -LiteralPath $home) { Remove-Item -LiteralPath $home -Recurse -Force }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install.ps1 -Help
          if ($LASTEXITCODE -ne 0) { throw "installer -Help failed ($LASTEXITCODE)" }
          python -m pip install --disable-pip-version-check uv
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install.ps1 `
            -DryRun -NoModels -NoDashboard -NonInteractive -QubitHome "$home"
          if ($LASTEXITCODE -ne 0) { throw "installer -DryRun failed ($LASTEXITCODE)" }
          if (Test-Path -LiteralPath $home) { throw "-DryRun created $home" }
      - name: Install from the checkout (no models, no dashboard)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_install)
        timeout-minutes: 45
        run: |
          python -m pip install --disable-pip-version-check uv
          $home = Join-Path $env:RUNNER_TEMP "qubit-install-e2e"
          if (Test-Path -LiteralPath $home) { Remove-Item -LiteralPath $home -Recurse -Force }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install.ps1 `
            -QubitHome "$home" -Channel stable -NoModels -NoDashboard -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw "installer failed ($LASTEXITCODE)" }

          foreach ($rel in @(
              "bin\qubit.cmd",
              "config.yaml",
              "voice\config\voice.yaml",
              "voice\data",
              "voice\state",
              "voice\cache",
              "voice\models")) {
            if (-not (Test-Path -LiteralPath (Join-Path $home $rel))) {
              throw "install did not produce $rel"
            }
          }
          if (Test-Path -LiteralPath (Join-Path $home ".hermes")) {
            throw "install created an upstream Hermes home"
          }

          & (Join-Path $home "bin\qubit.cmd") --version
          if ($LASTEXITCODE -ne 0) { throw "installed qubit launcher is not runnable" }
      - name: Record what this run did not verify
        if: always()
        run: |
          @'
          A green run proves the installer parses, -Help/-DryRun make no changes,
          and (when run_install is on) a checkout install with -NoModels
          -NoDashboard produces the Qubit home and launcher. It does not prove
          the pinned model downloads, the dashboard build, update/uninstall, or
          PATH/ACL behaviour on every Windows edition. Windows support stays
          unclaimed until the full install + update E2E passes.
          '@ | Write-Output
