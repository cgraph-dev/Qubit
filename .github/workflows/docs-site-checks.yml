name: docs-site-checks

# Adapted from upstream docs-site-checks. Builds the Docusaurus site to prove
# the documentation deploys cleanly, but never deploys: there is no deploy
# step, no secret, and no write permission.
#
# The upstream generator-staleness assertion is deliberately not ported:
# Qubit's committed per-skill pages predate the local generator/rebrand and a
# diff gate would be red before any documentation change. The link check and
# the ASCII-diagram lint still run against the committed pages.
on:
  pull_request:
    paths:
      - "qubit_runtime/website/**"
      - "qubit_runtime/skills/**"
      - "qubit_runtime/optional-skills/**"
      - ".github/workflows/docs-site-checks.yml"
  push:
    branches: [main, production]
    paths:
      - "qubit_runtime/website/**"
      - "qubit_runtime/skills/**"
      - "qubit_runtime/optional-skills/**"
      - ".github/workflows/docs-site-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-site-checks:
    name: Docs build, links, and diagrams
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install docs generators
        run: |
          python -m pip install --disable-pip-version-check \
            ruamel.yaml==0.18.17 ascii-guard==2.3.0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: qubit_runtime/website/package-lock.json
      - name: Pin the npm version required by the website engines
        run: npm install -g npm@11.17.0 --no-audit --no-fund
      - name: Install website dependencies
        working-directory: qubit_runtime/website
        run: npm ci --no-audit --no-fund
      - name: Extract skill metadata
        run: python3 qubit_runtime/website/scripts/extract-skills.py
      - name: Cross-page links resolve on GitHub and on the site
        run: python3 qubit_runtime/website/scripts/check_doc_links.py
      - name: Lint docs diagrams
        working-directory: qubit_runtime/website
        run: npm run lint:diagrams
      - name: Deploy check (build only, no deploy secrets)
        working-directory: qubit_runtime/website
        run: npm run build:fast
