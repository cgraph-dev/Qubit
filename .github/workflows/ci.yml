name: ci

# Minimal Qubit public-release CI. Pull requests are untrusted: every job here
# runs on GitHub-hosted Linux, never on a self-hosted runner. The existing
# upstream-derived workflows remain unchanged; this file is the release surface.
on:
  pull_request:
  push:
    branches: [main, production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-lint:
    name: Workflow lint and security policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install workflow policy dependency
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.3
      - name: actionlint
        run: |
          docker run --rm \
            -v "$PWD:$PWD" \
            -w "$PWD" \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      - name: Workflow security policy
        run: python3 .github/scripts/check_workflow_security.py

  lockfiles:
    name: npm lockfile integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Pin the npm version the workspace lockfiles were generated with
        run: npm install -g npm@10.9.8 --no-audit --no-fund
      - name: Lockfiles served by npm 10.9.8
        # --dry-run resolves the lockfile without writing node_modules, so a
        # stale lockfile fails here instead of in a later build lane.
        # --ignore-scripts keeps native postinstalls out of the check.
        run: |
          set -euo pipefail
          for dir in \
            frontend/qubit-web \
            qubit_runtime \
            qubit_runtime/scripts/whatsapp-bridge; do
            if [ ! -f "$dir/package-lock.json" ]; then
              echo "::error::$dir/package-lock.json is missing"
              exit 1
            fi
            echo "::group::npm ci --dry-run $dir"
            (cd "$dir" && npm ci --ignore-scripts --no-audit --no-fund --dry-run)
            echo "::endgroup::"
          done
      - name: Pin the npm version required by the website engine
        # website/package.json declares npm >=11.17.0 and its .npmrc sets
        # engine-strict=true, so the runner's bundled npm is too old there.
        # The other lockfiles are validated above with the bundled npm because
        # 11.17 is stricter about optional platform bindings in their
        # lockfiles.
        run: npm install -g npm@11.17.0 --no-audit --no-fund
      - name: Website lockfile matches package.json
        run: |
          set -euo pipefail
          if [ ! -f qubit_runtime/website/package-lock.json ]; then
            echo "::error::qubit_runtime/website/package-lock.json is missing"
            exit 1
          fi
          cd qubit_runtime/website
          npm ci --ignore-scripts --no-audit --no-fund --dry-run

  runtime-smoke:
    name: Runtime compile and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Compile the runtime and voice surface
        run: >
          python -m compileall -q
          qubit_runtime/qubit_cli
          qubit_runtime/gateway
          qubit_runtime/tools
          qubit_runtime/agent
          qubit_runtime/tui_gateway
          qubit_runtime/qubit_state*.py
          voicebridge
          scripts
      - name: Parse-check the runtime test tree
        run: python -m compileall -q qubit_runtime/tests
      - name: Root metadata smoke
        run: |
          python - <<'PY'
          import pathlib
          import tomllib

          root = pathlib.Path(".")
          data = tomllib.loads((root / "pyproject.toml").read_text(encoding="utf-8"))
          project = data["project"]
          assert project["name"] == "qubit-voicebridge", project["name"]
          for rel in (
              "qubit_runtime/qubit_cli/main.py",
              "voicebridge/cli.py",
              "frontend/qubit-web/package.json",
              "scripts/release_qualify.py",
          ):
              assert (root / rel).is_file(), f"missing {rel}"
          print("runtime-smoke-ok", project["version"])
          PY
      - name: Check the checkout is clean
        uses: ./.github/actions/check-clean-worktree

  macos-core:
    name: macOS core install and launchd contract
    # Opt-in stub: this job is complete, but it only runs on manual dispatch so
    # PRs do not wait on macOS runner provisioning. Enable it for every push by
    # removing the `if:` once a macOS runner is available to the repository.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        # `uv` is what the installer uses to create the venv; the dry-run tests
        # only need the binary on PATH, so no real install is performed here.
        run: python -m pip install --disable-pip-version-check pytest uv
      - name: Compile the installer and launchd surface
        run: >
          python -m compileall -q
          qubit_runtime/qubit_cli
          scripts
      - name: macOS install path and launchd contract
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/qubit_runtime
        run: |
          python -m pytest -q tests/test_macos_install_path.py
          cd qubit_runtime
          python -m pytest -q tests/qubit_cli/test_release_paths_contract.py
      - name: Check the checkout is clean
        uses: ./.github/actions/check-clean-worktree

  frontend:
    name: Frontend typecheck, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/qubit-web/package-lock.json
      - name: Install dashboard dependencies
        working-directory: frontend/qubit-web
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Install shared package dependencies
        # qubit-web's tsconfig includes ../qubit-shared/src and those modules
        # import react/lucide-react. Module resolution walks up from the shared
        # source tree, so a clean clone needs frontend/qubit-shared/node_modules
        # even though the package itself is a link. Its versions are pinned in
        # package.json; do not write a lockfile into the checkout.
        working-directory: frontend/qubit-shared
        run: npm install --include=dev --legacy-peer-deps --no-audit --no-fund --no-package-lock
      - name: Typecheck
        working-directory: frontend/qubit-web
        run: npm run typecheck
      - name: Tests
        working-directory: frontend/qubit-web
        run: npm run test
      - name: Build
        working-directory: frontend/qubit-web
        run: npm run build
      - name: Upload dashboard bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: frontend-dist
          path: frontend/qubit-dist
          if-no-files-found: error
          retention-days: 7
      - name: Check the checkout is clean
        uses: ./.github/actions/check-clean-worktree

  packaging:
    name: Release qualification (build, install, reproduce)
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Restore the built dashboard bundle
        # The wheel/sdist must ship frontend/qubit-dist; release_qualify.py
        # rejects a dashboard-less artifact. The bundle is git-ignored, so the
        # frontend job's artifact is the only source on a clean runner.
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: frontend-dist
          path: frontend/qubit-dist
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Build, install, and reproduce artifacts
        # Exit 0 PASS, 2 FAIL, 4 DEGRADED, 8 BLOCKED. A dirty tree blocks the
        # artifact steps, so this is a real release gate (not a demo).
        # CI never signs: the explicit --unsigned-ok policy records that these
        # are draft, unsigned artifacts (the report still lists NOT_SIGNED).
        # The tag is bound to pyproject/__version__ only on a real v* tag.
        run: |
          set -o pipefail
          args=(--build --install --reproduce --unsigned-ok --json
                --out dist/release)
          case "${GITHUB_REF_NAME:-}" in
            v*) args+=(--tag "$GITHUB_REF_NAME") ;;
          esac
          python scripts/release_qualify.py "${args[@]}" \
            | tee dist/release-report.json
      - name: Report the release verdict
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib

          path = pathlib.Path("dist/release-report.json")
          if not path.is_file():
              print("no release report produced")
              raise SystemExit(1)
          report = json.loads(path.read_text())
          version = report.get("version_identity", {})
          lines = [
              f"verdict: {report.get('verdict')}",
              f"tree: {report.get('tree', {}).get('state')}",
              "version: tag={tag} pyproject={pyproject} package={package} "
              "state={state}".format(
                  tag=version.get("tag"),
                  pyproject=version.get("pyproject_version"),
                  package=version.get("package_version"),
                  state=version.get("state"),
              ),
          ]
          for name, step in report.get("steps", {}).items():
              lines.append(f"{name}: {step.get('state', '?')}")
          text = "\n".join(lines)
          print(text)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("```\n" + text + "\n```\n")
          PY
      - name: Upload build report and artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-candidate
          path: |
            dist/release/build1/*.whl
            dist/release/build1/*.tar.gz
            dist/release-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Check the checkout is clean
        uses: ./.github/actions/check-clean-worktree
