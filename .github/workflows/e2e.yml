name: e2e

# Sharded end-to-end suite. Every shard runs a disjoint slice of the 157 E2E
# files in a fresh process tree; the release gate is the one full run, so CI
# keeps the runner count bounded by sharding rather than by weakening tests.
on:
  pull_request:
  push:
    branches: [main, production]
  workflow_dispatch:

permissions:
  contents: read

# Pushes get a per-commit group: the public seed is force-pushed to
# main/production every few minutes, and a branch-keyed group either cancels a
# run that is still working or queues the newer one behind it. Pull requests
# keep the old same-ref group so a new push to the PR still supersedes the
# previous run.
concurrency:
  group: >-
    e2e-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: E2E shard ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      SHARD: ${{ matrix.shard }}
      SHARDS: "8"
      TMPDIR: /tmp
      PYTHONPATH: ${{ github.workspace }}/qubit_runtime:${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Upgrade cells resolve N-1 from HEAD~1; fetch the parent commit only.
          # Tags stay unfetched unless a real-history checkout is deepened below.
          fetch-depth: 2
      - name: Provide upgrade history (real or synthesized)
        # The public release seed has a fresh one-commit history, so the upgrade suite's
        # N-1 = HEAD~1 does not exist there. On a root seed, create a two-commit chain whose
        # tip tree is the checked-out tree (both synthetic commits are empty); a real-history
        # checkout is deepened instead. No assertion is weakened: the clone-shape tests still
        # prove a real N-1 -> HEAD update.
        run: |
          if git rev-parse -q --verify "HEAD~1^{commit}" >/dev/null; then
            if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
              git fetch --unshallow --tags --quiet origin || true
              echo "deepened the existing history"
            fi
            echo "N-1 already present ($(git rev-list --count HEAD) commits); no synthesis needed"
            exit 0
          fi
          git -c user.name="Qubit E2E" -c user.email="e2e@qubit.invalid" -c commit.gpgsign=false \
            commit --allow-empty -q -m "e2e: synthesized N-1 for a single-commit seed"
          git -c user.name="Qubit E2E" -c user.email="e2e@qubit.invalid" -c commit.gpgsign=false \
            commit --allow-empty -q -m "e2e: synthesized release head"
          # actions/checkout fetches depth 2, so a root seed still carries a shallow marker
          # even though there is no older history to fetch. The synthesized chain above is
          # complete locally, so clear the spurious marker before the upgrade suite clones it.
          if [ -f .git/shallow ]; then
            rm -f .git/shallow
            echo "cleared the depth-2 shallow marker"
          fi
          echo "synthesized $(git rev-list --count HEAD) commits; HEAD~1=$(git rev-parse --short HEAD~1)"
      - name: Install E2E system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bubblewrap tmux sqlite3 ffmpeg
          # Ubuntu 24 restricts unprivileged user namespaces; the upgrade
          # hand-off tests drive a real bwrap sandbox.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --dev-bind / / --proc /proc --unshare-pid -- true
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" pytest-asyncio "discord.py[voice]==2.7.1" "aiohttp==3.14.4" "python-telegram-bot[webhooks]==22.8" "slack-bolt==1.30.0" "slack-sdk==3.44.1" "agent-client-protocol==0.9.0" uv
      - name: Select this shard
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          files = sorted(Path("tests/e2e").rglob("test_*.py"))
          shard = int(os.environ["SHARD"]) - 1
          shards = int(os.environ["SHARDS"])
          selected = [str(p) for i, p in enumerate(files) if i % shards == shard]
          Path("/tmp/e2e-shard.txt").write_text("\n".join(selected) + "\n", encoding="utf-8")
          print(f"shard {shard + 1}/{shards}: {len(selected)} of {len(files)} files")
          if not selected:
              raise SystemExit("empty E2E shard")
          PY
        working-directory: qubit_runtime
      - name: Run this E2E shard
        run: |
          # One flake retry per file: the hosted runner is 4 vCPU/16 GB and a few
          # live cells (SQLite torture, 429 rotation) are load-sensitive. A pass on
          # retry is still reported as FLAKY, and a deterministic failure fails
          # twice rather than being hidden.
          python scripts/run_tests_parallel.py \
            --files-from /tmp/e2e-shard.txt \
            -j 2 --file-timeout 1200 --file-retries 1
        working-directory: qubit_runtime
