name: qubit-ci
on:
  push:
  workflow_dispatch:
jobs:
  linux:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Python version
        run: python3 --version
      - name: Compile the runtime
        run: python3 -m compileall -q qubit_runtime/qubit_cli qubit_runtime/gateway qubit_runtime/tools
      - name: Parse-check the test tree
        run: python3 -m compileall -q qubit_runtime/tests

  artifact-install-e2e:
    # Release gate: install a built wheel into a throwaway venv/HOME and probe
    # the installed artifact. Runs on release tags and on manual dispatch (not
    # every push) because it builds a wheel and installs declared dependencies.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Require Python >= 3.12
        run: |
          python3 - <<'PY'
          import sys
          if sys.version_info < (3, 12):
              raise SystemExit(
                  "artifact-install E2E requires Python >= 3.12 "
                  f"(found {sys.version.split()[0]})")
          print(sys.version)
          PY
      - name: Build the dashboard bundle if absent
        run: |
          if [ ! -f frontend/qubit-dist/index.html ]; then
            bash scripts/build_dashboard.sh
          fi
      - name: Artifact-install E2E
        run: |
          python3 scripts/artifact_install_e2e.py --build --require-network \
            --require-clean --report dist/artifact-install-e2e.json
      - name: Upload the artifact-install report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifact-install-e2e-report
          path: dist/artifact-install-e2e.json
          if-no-files-found: warn
