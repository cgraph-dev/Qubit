name: Case Collision Check

# Rejects tracked paths that differ only by case (README.md vs readme.md).
# Linux is case-sensitive; Windows and macOS (default) are not, so a
# case-colliding pair breaks every clone on a case-insensitive host.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: case-collision-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-case-collisions:
    name: Reject case-colliding paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Run case-collision checker
        run: python3 qubit_runtime/scripts/check-case-collisions.py
