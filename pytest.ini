[pytest]
markers =
    unit: hermetic unit/contract tests (no live services, no network)
    contract: pinned contract / packet boundary tests
    integration: HTTP/webui integration tests against a local server
    smoke: hermetic startup/dashboard/task/cancellation/voice smoke tests
    live: opt-in tests requiring a real model/browser/service (DEGRADED when skipped)
    monitor: opt-in long-running monitoring / clean-venv checks (never in normal runs)
    dashboard: live-dashboard probes against a running bridge
    ui: opt-in Packet 8L Playwright accessibility/responsive browser checks (excluded from hermetic default)
addopts = -m "not live and not dashboard and not monitor and not ui"
# skills/ holds untracked third-party skill checkouts (e.g. ui-ux-pro-max)
# with their own test layouts that assume a different repo root; they are
# never part of the hermetic Qubit gates.
# qubit_runtime/ is the Qubit-owned fork of the pinned upstream runtime; its own
# test suite is large and is run explicitly (scripts/), never by the Qubit
# hermetic gates (see docs/archive/2026-09-21/QUBIT_OWNER_AMENDMENT_2026-09-11_HERMES_RUNTIME.md).
norecursedirs = .* build dist node_modules venv .venv skills qubit_runtime
# ``tests/`` itself holds importable helpers (``tmp_policy``, ``_fixtures``).
# It is on sys.path today only because pytest's rootdir/import-mode happens to
# prepend the test file's directory for a flat ``tests/`` tree; once a test
# subtree exists that pytest treats as a package (``tests/gateway/``), that
# directory becomes the file's basedir and the bare ``import tmp_policy`` in
# ``tests/conftest.py`` stops resolving. Declaring it here makes the resolution
# explicit and independent of import mode.
#
# ``qubit_runtime`` is the checkout's source root: this tree vendors the agent
# there (``qubit_runtime/qubit_state.py``, ``qubit_runtime/qubit_cli/``), so a test
# in the root ``tests/`` tree that says ``from qubit_state import SessionDB`` only
# resolves when that directory is on the path. It was absent, and 64 files under
# ``tests/qubit_state`` and ``tests/`` failed at collection with "cannot import name
# 'SessionDB' from 'qubit_state' (unknown location)" — the module imported as an
# empty namespace package instead of the real one. Listed after ``tests`` so the
# tree's own helpers keep priority.
pythonpath = tests qubit_runtime
filterwarnings =
    error
    # Upstream (vendored, byte-identical) Copilot token-exchange runs on a
    # daemon thread and can leave an SSLSocket for the GC on a networkless
    # host; the resulting ResourceWarning is environment noise with no product
    # impact and is scoped here rather than patching the pinned fork. Every
    # other warning remains an error.
    default:.*unclosed <ssl\.SSLSocket.*:ResourceWarning
    # ``sqlite3.Connection`` finalised by the GC instead of being closed. The warning
    # fires while Python finalises the object at teardown, AFTER a test has already
    # passed — the files it marked failed (e.g.
    # tests/agent/test_compression_adoption_preserves_live_tail.py) report "4 passed"
    # and still fail the file, because ``error`` promotes the teardown warning.
    # Deduplicating the sink, not making a bug claim: explicit close() is still
    # required, the leak itself is being fixed separately, and any other
    # ResourceWarning from a connection still fails.
    default:.*unclosed database.*:ResourceWarning
    # ``lark-oapi`` (the Feishu/Lark platform SDK, declared as the ``feishu``
    # extra in qubit_runtime/pyproject.toml) bootstraps its bundled protobuf
    # package with ``pkg_resources.declare_namespace`` at import time. setuptools
    # 80.x emits a deprecation UserWarning for that call, and this project
    # deliberately pins ``setuptools<81`` so ``pkg_resources`` stays importable
    # (see [project].dependencies) — so the warning is expected, not a defect.
    # It is raised INSIDE site-packages on every ``import lark_oapi``, which the
    # feishu adapter and its tests must do (``_load_lark_oapi`` binds real
    # request-builder classes; the tests are not importing it gratuitously), so
    # it cannot be fixed in this repo and must not fail a green suite under
    # ``error``. Scoped by the emitting MODULE field (4th field) so these same
    # warnings raised from Qubit code still fail the build.
    #
    # The module pattern must end with ``(\.|$)``, not ``\.`` + ``.*``. A bare
    # ``pkg_resources\..*`` never matches the module name ``pkg_resources`` itself
    # (it needs the trailing dot), and ``pkg_resources.declare_namespace`` is
    # RECURSIVE: calling it for ``lark_oapi.ws.pb.google`` re-warns once per parent
    # (``lark_oapi.ws.pb``, ``lark_oapi.ws``, ``lark_oapi``) from INSIDE
    # ``pkg_resources/__init__.py``, so those copies carry the emitting module
    # ``pkg_resources``, not ``lark_oapi.*``. With only the ``\.``-suffixed patterns
    # every gateway test that imports the Feishu adapter still died with
    # "DeprecationWarning: Deprecated call to ... declare_namespace('lark_oapi.ws.pb')"
    # — 111 files, the single largest failure class in the suite.
    ignore:pkg_resources is deprecated as an API.*:UserWarning:lark_oapi(\.|$)
    ignore:pkg_resources is deprecated as an API.*:UserWarning:pkg_resources(\.|$)
    ignore:Deprecated call to `pkg_resources\.declare_namespace.*:DeprecationWarning:lark_oapi(\.|$)
    ignore:Deprecated call to `pkg_resources\.declare_namespace.*:DeprecationWarning:pkg_resources(\.|$)
    ignore:datetime\.datetime\.utcfromtimestamp\(\) is deprecated.*:DeprecationWarning:lark_oapi(\.|$)